[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "toxicguard"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.1",
    "joblib>=1.5.3",
    "lightgbm>=4.6.0",
    "pandas>=3.0.3",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "python-multipart>=0.0.29",
    "scikit-learn==1.6.1",
    "uvicorn>=0.47.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/toxicguard"]
